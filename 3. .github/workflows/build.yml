name: Build APK

on:
  workflow_dispatch:
    inputs:
      XRAY_CORE_VERSION:
        description: 'Xray core version'
        required: true
        default: 'v25.1.30'
      V2RAYNG_VERSION:
        description: 'v2rayNG version'
        required: true
        default: '1.0-dash'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build with Gradle
        run: |
          cd V2rayNG
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          XRAY_VERSION: ${{ github.event.inputs.XRAY_CORE_VERSION }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DashVPN-APK
          path: V2rayNG/app/build/outputs/apk/release/*.apk
