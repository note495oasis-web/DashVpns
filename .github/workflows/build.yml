name: Manual Build Debug APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force Gradle Version
        run: |
          cd V2rayNG
          # Принудительно заставляем внутренний конфигуратор использовать стабильную версию 8.7
          sed -i 's/gradle-.*-bin.zip/gradle-8.7-bin.zip/g' gradle/wrapper/gradle-wrapper.properties

      - name: Inject Xray Core Library
        run: |
          cd V2rayNG
          mkdir -p app/libs
          curl -L -o app/libs/libv2ray.aar "https://cdn.jsdelivr.net/gh/2dust/v2rayNG@master/V2rayNG/app/libs/libv2ray.aar"


      - name: Build Debug APK
        run: |
          cd V2rayNG
          chmod +x gradlew
          ./gradlew clean assembleFdroidDebug
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DashVPN-Debug-APK
          path: V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk
